user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON-ish access log so `docker compose logs nginx | jq .` is feasible.
    log_format json_combined escape=json
      '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"path":"$request_uri","status":$status,"bytes_sent":$bytes_sent,'
      '"referrer":"$http_referer","ua":"$http_user_agent","dur_ms":$request_time}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Large uploads go through here (chunked 8 MiB by client; nginx passes on).
    client_max_body_size 8G;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/plain application/javascript application/json application/xml text/css;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}

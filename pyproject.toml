[project]
name = "reelforge"
version = "0.1.0"
description = "Containerized long-form-to-reels video pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Queue / broker
    "arq>=0.26",
    "redis>=5.2",
    # External services
    "anthropic>=1.0,<2",
    # CLI
    "typer>=0.15",
    "rich>=13.9",
    # Analysis pipeline
    # OpenCV comes from opencv-contrib-python only (see [tool.uv] overrides):
    # mediapipe needs it, and it restores cv2.CascadeClassifier, which
    # OpenCV 5's base wheel dropped — compose/reframe.py's face detection.
    "scenedetect>=0.6.4",
    "opencv-contrib-python>=5.0",
    # Eye-contact correction (compose/eyecontact.py): FaceLandmarker iris
    # landmarks. Needs libEGL/libGLES at load time even on CPU (Dockerfile).
    "mediapipe>=1.0.1,<2",
    "faster-whisper>=1.0.0",
    "numpy>=1.26,<3",
    # Phase 5: API persistence + async I/O
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "aiofiles>=24.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "fakeredis>=2.26",
]

[tool.uv]
# scenedetect 0.7 hard-requires opencv-python; mediapipe requires
# opencv-contrib-python. Both install `cv2` and clobber each other, so the
# base wheel is overridden away (impossible marker) — contrib is a superset.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

name: reelforge-prod

# Production overlay. Pulls pre-built images from GHCR and fronts everything
# with nginx + certbot. See docs/deployment.md for the full walkthrough.
#
# Required env vars:
#   GH_OWNER                 (the repo owner on GitHub)
#   VERSION                  (image tag, e.g. v0.7.0 or 'latest')
#   DOMAIN                   (fully-qualified hostname)
#   ANTHROPIC_API_KEY        (real key)
#   AUTH_MODE=disabled|single_user
#   AUTH_USERNAME, AUTH_PASSWORD_BCRYPT, AUTH_SESSION_SECRET (if single_user)
#   SENTRY_DSN               (optional)

services:
  api:
    image: ghcr.io/${GH_OWNER}/reelforge-api:${VERSION:-latest}
    restart: unless-stopped
    environment:
      REELFORGE_ENV: production
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "https://${DOMAIN}"
      LOG_LEVEL: INFO
      SENTRY_DSN: ${SENTRY_DSN:-}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_BCRYPT: ${AUTH_PASSWORD_BCRYPT:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ./data:/data
      - whisper_models:/models/whisper
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [reelforge_net]

  worker:
    image: ghcr.io/${GH_OWNER}/reelforge-worker:${VERSION:-latest}
    restart: unless-stopped
    environment:
      REELFORGE_ENV: production
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SENTRY_DSN: ${SENTRY_DSN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      redis: { condition: service_healthy }
    volumes:
      - ./data:/data
      - whisper_models:/models/whisper
    networks: [reelforge_net]

  web:
    # The web bundle inlines NEXT_PUBLIC_API_URL at build time; the published
    # images are built with `https://${DOMAIN}/api`. If you self-host under a
    # different domain, rebuild from source with the correct arg.
    image: ghcr.io/${GH_OWNER}/reelforge-web:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [reelforge_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [reelforge_net]

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    depends_on: [nginx]

volumes:
  letsencrypt:
  certbot-www:
